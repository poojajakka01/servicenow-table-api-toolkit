[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servicenow-table-api-toolkit"
version = "1.0.0"
description = "Resilient Python client for the ServiceNow Table and Import Set APIs"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Pooja Jakka"}]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5"]

[tool.setuptools]
packages = ["snow_toolkit"]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E", "F"]
